# The fleet: up to 9 instances in 3 zones (3/3/3), of which the capacity plan says how many run, behind an Envoy load balancer, a shared ledger with a bounded pool, and
# PostgreSQL behind it. Every instance is a container pinned to its own vCPU with a 256 MiB limit, so one instance's
# capacity is a stable number. Prometheus scrapes Envoy (the edge) and every instance.
name: sre-capacity-and-readiness

x-instance: &instance
  build: .
  image: sre-capacity-and-readiness:dev
  command: ["capacity-instance"]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  # One whole vCPU of its own, not a 1.0 CPU quota: a CFS quota throttles a busy container in bursts (measured: 8 of 103
  # periods throttled at 73% use, p99 58 ms), so latency would jump long before the core is full. Pinned to a core only
  # this instance may use (cores 9 to 11 are shared by the balancer, ledger, database, Prometheus and load generator), 100% of the core means the core is full.
  mem_limit: 256m
  stop_grace_period: 15s
  # The check runs inside the container, on the instance's own core. Starting a Python interpreter every 5 seconds
  # stalled the event loop for 30 to 70 ms each time (a spike in two of every five 2-second windows of p99); a bash
  # /dev/tcp request costs a couple of milliseconds.
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9101 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
    interval: 5s
    timeout: 15s
    retries: 40
    start_period: 10s

x-instance-env: &instance-env
  WORK_ROUNDS: ${WORK_ROUNDS:-6000}
  # Empty means no shared dependency: the first tests find the CPU knee on its own. `make run` sets it for the pool tests.
  LEDGER_URL: ${LEDGER_URL:-}
  LEDGER_TIMEOUT_S: ${LEDGER_TIMEOUT_S:-0.5}
  VERSION: ${APP_VERSION:-v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # On a stop, keep serving for this long with /healthz at 503, so Envoy (1 second health checks) takes the instance
  # out of rotation before it stops accepting connections. Needs to be well under stop_grace_period.
  DRAIN_S: ${DRAIN_S:-3}

services:
  app-a1:
    <<: *instance
    cpuset: "0"
    environment:
      <<: *instance-env
      ZONE: a
      INSTANCE: a1
    ports:
      - "127.0.0.1:${APP_A1_PORT:-47282}:8080"
      - "127.0.0.1:${APP_A1_OPS_PORT:-47283}:9101"
  app-a2:
    <<: *instance
    cpuset: "1"
    environment:
      <<: *instance-env
      ZONE: a
      INSTANCE: a2
  app-a3:
    <<: *instance
    cpuset: "2"
    environment:
      <<: *instance-env
      ZONE: a
      INSTANCE: a3
  app-b1:
    <<: *instance
    cpuset: "3"
    environment:
      <<: *instance-env
      ZONE: b
      INSTANCE: b1
  app-b2:
    <<: *instance
    cpuset: "4"
    environment:
      <<: *instance-env
      ZONE: b
      INSTANCE: b2
  app-b3:
    <<: *instance
    cpuset: "5"
    environment:
      <<: *instance-env
      ZONE: b
      INSTANCE: b3
  app-c1:
    <<: *instance
    cpuset: "6"
    environment:
      <<: *instance-env
      ZONE: c
      INSTANCE: c1
  app-c2:
    <<: *instance
    cpuset: "7"
    environment:
      <<: *instance-env
      ZONE: c
      INSTANCE: c2
  app-c3:
    <<: *instance
    cpuset: "8"
    environment:
      <<: *instance-env
      ZONE: c
      INSTANCE: c3

  lb:
    image: envoyproxy/envoy:v1.32.3
    cpuset: "9-11"
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./deploy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:${EDGE_PORT:-47280}:8080"
      - "127.0.0.1:${ENVOY_ADMIN_PORT:-47281}:9901"
    depends_on:
      app-a1:
        condition: service_healthy
      app-a2:
        condition: service_healthy
      app-a3:
        condition: service_healthy
      app-b1:
        condition: service_healthy
      app-b2:
        condition: service_healthy
      app-b3:
        condition: service_healthy
      app-c1:
        condition: service_healthy
      app-c2:
        condition: service_healthy
      app-c3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: lb\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 5s

  db:
    image: postgres:18
    cpuset: "9-11"
    # The ledger writes an entry per request, 2,000 times a second at the projected peak. Waiting for a disk flush on
    # every commit stalled requests for 100 to 400 ms on a laptop's virtual disk and hid the pool; the entries are
    # test data, so a commit may return before its flush.
    command: ["postgres", "-c", "synchronous_commit=off"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-local-dev-only-app}
    volumes:
      - ./sql/000_roles.sh:/docker-entrypoint-initdb.d/000_roles.sh:ro
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-47232}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ledger"]
      interval: 3s
      timeout: 5s
      retries: 20

  ledger:
    build: .
    image: sre-capacity-and-readiness:dev
    command: ["capacity-ledger"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    cpus: 2.0
    cpuset: "9-11"
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledger_app:${LEDGER_DB_PASSWORD:-local-dev-only-app}@db:5432/ledger
      POOL_SIZE: ${POOL_SIZE:-20}
      POOL_TIMEOUT_S: ${POOL_TIMEOUT_S:-0.4}
      HOLD_MS: ${HOLD_MS:-10}
      # Two processes share the ledger's port and its pool: one Python event loop cannot take the projected peak.
      WORKERS: ${LEDGER_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${LEDGER_OPS_PORT:-47284}:9102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9102/readyz', timeout=2)"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    cpus: 0.5
    cpuset: "9-11"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-47290}:9090"
    volumes:
      - ./slo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./slo/generated:/etc/prometheus/rules/generated:ro
      - ./slo/alerts:/etc/prometheus/rules/alerts:ro
    depends_on:
      lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 15s
      retries: 40

  # The load generator runs inside the compose network, so a laptop's port forwarding is not in the measurement.
  # Run it with `docker compose run --rm -T loadtest ...` (the Makefile does).
  loadtest:
    build: .
    image: sre-capacity-and-readiness:dev
    profiles: ["tools"]
    entrypoint: ["capacity-loadtest"]
    # The generator must never be the slow party: give it the largest CPU share so its own lag stays out of the numbers.
    cpu_shares: 4096
    cpuset: "9-11"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
