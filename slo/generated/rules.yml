  - alert: ApiLatencyBudgetLeak
    expr: |-
      slo:sli_error:ratio_rate3d{slo="api_latency"} > (1 * 0.01)
      and slo:sli_error:ratio_rate6h{slo="api_latency"} > (1 * 0.01)
      and slo:sli_bad_events:increase3d{slo="api_latency"} >= 10
