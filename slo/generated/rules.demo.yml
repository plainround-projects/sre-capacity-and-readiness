- name: slo-meta-demo
  interval: 1s
  rules:
  - alert: EdgeMetricsAbsentDemo
    expr: absent(envoy_http_downstream_rq_xx)
    for: 5s
    labels:
      severity: page
    annotations:
      summary: The edge exports no request metrics, so every SLI is blind
      runbook_url: docs/runbooks/edge-metrics-absent.md
